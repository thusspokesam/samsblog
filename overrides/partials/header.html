<header class="site-header">
  <div class="site-header__bar">
    <a class="brand" href="{{ '.' | url }}" aria-label="GPUaaS Operations — home">
      <span class="brand__full">{% include "partials/logo.html" %}</span>
      <img class="brand__mark" src="{{ 'assets/brand/mark.svg' | url }}" alt="" width="36" height="36">
    </a>
    <nav class="primary" aria-label="Primary">
      <a href="{{ '.' | url }}" class="primary__home"{% if page and page.url == '' %} aria-current="page"{% endif %}>Home</a>
      {% for item in nav.items %}{% if item.children %}
      <a href="{{ item.children[0].url | url }}"{% if page and page.ancestors and page.ancestors[0].title == item.title %} aria-current="true"{% endif %}>{{ item.title }}</a>
      {% endif %}{% endfor %}
    </nav>
    <div class="tools">
      <button type="button" class="tool tool--search js-only" data-search-open aria-label="Search" aria-keyshortcuts="/ Control+K Meta+K">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="tool__label">Search</span><kbd class="hint" data-hint>/</kbd>
      </button>
      <button type="button" class="tool js-only" id="theme" aria-pressed="false" aria-label="Dark mode">
        <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="tool tool--repo" href="{{ config.repo_url }}" aria-label="GitHub repository" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
      </a>
      <details class="menu">
        <summary aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></summary>
        <nav class="menu__panel" aria-label="Menu">
          {% include "partials/nav.html" %}
          <a class="menu__repo" href="{{ config.repo_url }}" rel="noopener">GitHub repository</a>
        </nav>
      </details>
    </div>
  </div>
  <div class="redline" aria-hidden="true"></div>
</header>
