site_name: GPUaaS / Knowledge
site_url: https://thusspokesam.github.io/samsblog/
site_description: Product engineering, deployment, and operations documentation for AI infrastructure.
repo_url: https://github.com/thusspokesam/samsblog
edit_uri: edit/main/docs/
theme:
  variant: modern
  font: false
  logo: assets/gpuaas-operations.png
  favicon: assets/gpuaas-operations.png
  palette:
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
plugins:
  - search
nav:
  - Home: index.md
  - Product Engineering:
      - Overview: product-engineering/index.md
      - Approved versions: product-engineering/approved-versions.md
      - Benchmarking results: product-engineering/benchmarking-results.md
      - Internal benchmarking procedure: product-engineering/benchmarking-procedure.md
  - Deploy & Ops:
      - Overview: deploy-ops/index.md
      - Deployment guide: deploy-ops/deployment-guide.md
      - Validation procedure: deploy-ops/validation-procedure.md
      - Burn-in procedure: deploy-ops/burn-in-procedure.md
      - Onboarding process: deploy-ops/onboarding-process.md
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
