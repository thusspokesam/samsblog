site_name: Sam's Blog
site_url: https://thusspokesam.github.io/samsblog/
site_description: Notes on technology, AI, and things worth building.
site_author: Sameer Relan
repo_url: https://github.com/thusspokesam/samsblog
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  icon:
    logo: material/notebook-outline
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
  - blog:
      blog_dir: .
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive_date_format: yyyy
      categories: true
nav:
  - Blog: index.md
  - About: about.md
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
copyright: Copyright © 2026 Sameer Relan
