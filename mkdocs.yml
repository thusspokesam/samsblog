site_name: GPUaaS / r Operations
site_url: https://thusspokesam.github.io/samsblog/
site_description: Engineering and operations documentation for AI infrastructure.
repo_url: https://github.com/thusspokesam/samsblog
edit_uri: edit/main/docs/
use_directory_urls: true
theme:
  variant: modern
  custom_dir: overrides
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/gpuaas-logo.png
  favicon: assets/gpuaas-logo.png
  palette:
    scheme: default
    primary: white
    accent: red
  features:
    - navigation.indexes
    - navigation.sections
    - content.action.edit
    - content.code.copy
    - search.highlight
plugins:
  - search
extra_css:
  - stylesheets/hub.css
extra_javascript:
  - assets/hub.js
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
extra:
  status:
    new: New
    updated: Updated
    draft: Draft — not approved
    deprecated: Deprecated
    stable: Stable
